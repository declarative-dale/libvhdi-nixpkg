name: Sync libvhdi upstream

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect, update, and build without committing or tagging"
        required: false
        default: false
        type: boolean

concurrency:
  group: libvhdi-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        if: vars.CACHIX_CACHE_NAME != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
        continue-on-error: true

      - name: Detect upstream release
        id: upstream
        run: |
          set -euo pipefail

          current_version=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([0-9]{8})";.*/\1/p' default.nix | head -1)
          latest_version=$(
            git ls-remote --tags --refs "https://github.com/libyal/libvhdi.git" \
              | sed -nE 's#.*refs/tags/([0-9]{8})$#\1#p' \
              | sort -u \
              | tail -1
          )

          if [ -z "$current_version" ]; then
            echo "Failed to read current package version from default.nix" >&2
            exit 1
          fi

          if [ -z "$latest_version" ]; then
            echo "Failed to read latest upstream libvhdi tag" >&2
            exit 1
          fi

          echo "Current package version: $current_version"
          echo "Latest upstream version: $latest_version"

          if [ "$latest_version" = "$current_version" ]; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_available=true" >> "$GITHUB_OUTPUT"
          fi

          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "latest_version=$latest_version" >> "$GITHUB_OUTPUT"

      - name: Update package metadata
        if: ${{ steps.upstream.outputs.update_available == 'true' }}
        run: |
          chmod +x ./update.sh
          ./update.sh

      - name: Verify package metadata changed
        if: ${{ steps.upstream.outputs.update_available == 'true' }}
        id: package
        run: |
          set -euo pipefail

          if git diff --quiet -- default.nix; then
            echo "Updater reported a new upstream tag, but default.nix did not change" >&2
            exit 1
          fi

          new_version=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([0-9]{8})";.*/\1/p' default.nix | head -1)

          if [ "$new_version" != "${{ steps.upstream.outputs.latest_version }}" ]; then
            echo "Package version $new_version does not match upstream tag ${{ steps.upstream.outputs.latest_version }}" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$new_version" >/dev/null; then
            echo "Tag $new_version already exists in this repository" >&2
            exit 1
          fi

          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Format and lint
        if: ${{ steps.upstream.outputs.update_available == 'true' }}
        run: |
          nix develop .#default -c nixpkgs-fmt default.nix flake.nix
          nix develop .#default -c shellcheck update.sh
          git diff --check

      - name: Build updated package
        if: ${{ steps.upstream.outputs.update_available == 'true' }}
        run: nix build .#libvhdi -L

      - name: Run flake checks
        if: ${{ steps.upstream.outputs.update_available == 'true' }}
        run: nix flake check --no-write-lock-file -L

      - name: Confirm FUSE support
        if: ${{ steps.upstream.outputs.update_available == 'true' }}
        run: |
          ldd result/bin/vhdimount
          ldd result/bin/vhdimount | grep -E 'libfuse3|libfuse'

      - name: Commit and tag package update
        if: ${{ steps.upstream.outputs.update_available == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        run: |
          set -euo pipefail

          new_version="${{ steps.package.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add default.nix flake.nix
          git commit -m "libvhdi: update to $new_version"
          git tag -a "$new_version" -m "libvhdi $new_version"

          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "refs/tags/$new_version"

      - name: Report result
        if: always()
        run: |
          {
            echo "## libvhdi upstream sync"
            echo ""
            echo "- Current package version before run: \`${{ steps.upstream.outputs.current_version }}\`"
            echo "- Latest upstream version: \`${{ steps.upstream.outputs.latest_version }}\`"
            echo "- Update available: \`${{ steps.upstream.outputs.update_available }}\`"

            if [ "${{ steps.upstream.outputs.update_available }}" = "true" ]; then
              echo "- Updated package version: \`${{ steps.package.outputs.new_version }}\`"
              if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
                echo "- Dry run: package was built and checked, but no commit or tag was pushed"
              else
                echo "- Pushed tag: \`${{ steps.package.outputs.new_version }}\`"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
